# Dependabot 依赖安全更新配置
# 文档：https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - '3695824069'
